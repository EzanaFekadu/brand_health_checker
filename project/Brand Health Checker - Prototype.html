<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brand Health Checker — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #efece3; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
  /* Content is ALWAYS visible (opacity:1); entrance animates transform only,
     so a throttled/background tab that pauses animations never hides a screen. */
  .bhc-screen { opacity: 1; }
  @keyframes bhcPush { from { transform: translateX(22px); } to { transform: translateX(0); } }
  @keyframes bhcPop  { from { transform: translateX(-18px); } to { transform: translateX(0); } }
  .bhc-push { animation: bhcPush 0.24s cubic-bezier(.32,.72,0,1) both; }
  .bhc-pop  { animation: bhcPop 0.24s cubic-bezier(.32,.72,0,1) both; }
  @media (prefers-reduced-motion: reduce) { .bhc-push, .bhc-pop { animation: none; } }
  /* OCR + skeleton */
  @keyframes bhcShimmer { 0% { opacity: 0.55; } 50% { opacity: 1; } 100% { opacity: 0.55; } }
  .bhc-shimmer { animation: bhcShimmer 1.1s ease-in-out infinite; }
  @keyframes ocrSweep { 0% { top: -36px; } 100% { top: 100%; } }
  .ocr-sweep { animation: ocrSweep 1.5s linear infinite; }
  @keyframes ocrPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.5; } }
  .ocr-pulse { animation: ocrPulse 0.9s ease-in-out infinite; }
  /* hide scrollbars inside the phone for a native feel */
  #root ::-webkit-scrollbar { width: 0; height: 0; }
  #root * { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-core.jsx"></script>
<script type="text/babel" src="screens-more.jsx"></script>
<script type="text/babel" src="screens-ocr.jsx"></script>
<script type="text/babel" src="prototype-app.jsx"></script>
</body>
</html>
