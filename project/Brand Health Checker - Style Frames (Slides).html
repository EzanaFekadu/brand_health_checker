<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brand Health Checker — Style Frames (Slides)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0c0a; overflow: hidden; }
  * { box-sizing: border-box; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #canvas { width: 1920px; height: 1080px; position: relative; transform-origin: center center; flex: none; flex-shrink: 0; }
  .pslide { position: absolute; inset: 0; width: 1920px; height: 1080px; display: none; overflow: hidden; }
  .pslide.active { display: block; }
  .nav { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; z-index: 50; font-family: 'Hanken Grotesk', sans-serif; }
  .nav button { width: 42px; height: 42px; border-radius: 11px; border: none; background: rgba(255,255,255,0.14); color: #fff; font-size: 18px; cursor: pointer; }
  .nav button:hover { background: rgba(255,255,255,0.26); }
  .nav .count { color: #fff; opacity: 0.7; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><div id="canvas"></div></div>
<div class="nav" data-omelette-chrome>
  <button onclick="goToSlide(cur-1)">‹</button>
  <span class="count" id="count">1 / 5</span>
  <button onclick="goToSlide(cur+1)">›</button>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="deck-slides.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('canvas')).render(<window.Deck />);
  let cur = 0;
  function slides() { return document.querySelectorAll('.pslide'); }
  function goToSlide(n) {
    const s = slides(); if (!s.length) return;
    cur = Math.max(0, Math.min(s.length - 1, n));
    s.forEach((el, i) => el.classList.toggle('active', i === cur));
    document.getElementById('count').textContent = (cur + 1) + ' / ' + s.length;
  }
  window.goToSlide = goToSlide;
  function fit() {
    const sc = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById('canvas').style.transform = 'scale(' + sc + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') goToSlide(cur+1); if (e.key === 'ArrowLeft') goToSlide(cur-1); });
  // wait for components to mount
  setTimeout(() => { goToSlide(0); fit(); }, 60);
</script>
</body>
</html>
